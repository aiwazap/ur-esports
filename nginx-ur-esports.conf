# ═══════════════════════════════════════════════
# UR ESPORTS v2.0 — Nginx 配置
# 路径: /etc/nginx/sites-available/ur-esports
# 启用: ln -s /etc/nginx/sites-available/ur-esports /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════

server {
    listen 80;
    server_name ur-esports.cn www.ur-esports.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ur-esports.cn www.ur-esports.cn;

    # SSL 证书 (请根据实际路径调整)
    ssl_certificate     /etc/letsencrypt/live/ur-esports.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ur-esports.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 日志
    access_log /var/log/nginx/ur-esports-access.log;
    error_log  /var/log/nginx/ur-esports-error.log;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ═══════════════════════════════════════════════
    # 🔧 关键修复：选手照片 /uploads 路径代理
    # 之前缺少此配置导致照片不显示
    # ═══════════════════════════════════════════════
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1h;          # 头像缓存 1 小时
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── API 代理到 Node 后端 ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── 前端静态文件 ──
    root /home/ubuntu/ur-esports/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源缓存 ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 安全：禁止访问隐藏文件 ──
    location ~ /\. {
        deny all;
    }
}
