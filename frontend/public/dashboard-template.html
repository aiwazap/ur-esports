<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--p:#00d4ff;--bg:#060b14;--bgp:rgba(8,14,32,0.95);--tp:#e2e8f0;--ts:#8b9ab0;--td:#5a6a85;--suc:#00e676;--dan:#ff1744;--warn:#ffab00;--bd:rgba(0,212,255,0.15);--bds:rgba(0,212,255,0.3)}
body{font-family:'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tp);padding:12px 20px}
.db-panel{background:var(--bgp);border:1px solid var(--bd);border-radius:8px;position:relative}
.db-panel::before,.db-panel::after{content:'';position:absolute;width:8px;height:8px;border:2px solid var(--p);z-index:2}
.db-panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.db-panel::after{top:-1px;right:-1px;border-left:none;border-bottom:none}
.db-pin{position:relative;padding:16px}
.db-ph{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.db-phi{width:4px;height:16px;border-radius:2px;background:linear-gradient(135deg,var(--p),#0066cc)}
.db-phi.warn{background:linear-gradient(135deg,var(--warn),#ff6d00)}
.db-phi.danger{background:linear-gradient(135deg,var(--dan),#d50000)}
.db-pt{font-size:14px;font-weight:600}
.db-pb{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:4px;background:rgba(0,212,255,0.08);color:var(--p);border:1px solid var(--bd);white-space:nowrap}
.kpi-r{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi-c{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bgp);border:1px solid var(--bd);border-radius:8px;position:relative}
.kpi-c::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(135deg,var(--p),#0066cc);opacity:.5}
.kpi-i{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;background:rgba(0,212,255,.06);color:var(--p)}
.kpi-l{font-size:12px;color:var(--td)}.kpi-v{font-size:22px;font-weight:700}.kpi-t{font-size:10px;margin-top:2px}
.top-r{display:grid;grid-template-columns:320px 1fr 320px;gap:14px;margin-bottom:16px}
.mev{font-size:16px;font-weight:700;color:var(--p);text-align:center}.mst{font-size:12px;color:var(--ts);text-align:center;margin-bottom:12px}
.mvs{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.mtn{font-size:20px;font-weight:700}.mtr{font-size:10px;color:var(--td)}.mvt{font-size:16px;font-weight:700;color:var(--p)}
.cdb{display:flex;gap:6px;justify-content:center}.cdi{text-align:center}
.cdv{font-size:22px;font-weight:700;color:var(--p);padding:5px 8px;background:rgba(0,212,255,.04);border:1px solid var(--bd);border-radius:6px;min-width:40px}
.cdl{font-size:9px;color:var(--td);margin-top:2px}
.h2h{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px;font-size:10px;color:var(--td)}
.h2h-d{width:5px;height:5px;border-radius:50%}.h2h-d.w{background:var(--suc)}.h2h-d.l{background:var(--dan)}
.sv{font-size:14px;color:var(--p);text-align:center;margin-bottom:4px}.sn{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.sm{font-size:12px;color:var(--ts);text-align:center;margin-bottom:10px}
.sig{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sii{text-align:center}.sil{font-size:10px;color:var(--td)}.siv{font-size:12px;font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.gl{height:1px;background:linear-gradient(90deg,transparent,var(--p),transparent);margin:10px 0;opacity:.25}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{padding:8px 6px;text-align:left;color:var(--ts);font-weight:500;border-bottom:1px solid var(--bd);font-size:10px}
.dt td{padding:7px 6px;border-bottom:1px solid rgba(0,212,255,.04)}
.dt tr:hover td{background:rgba(0,212,255,.05)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.tag-w{background:rgba(0,230,118,.15);color:var(--suc);border:1px solid rgba(0,230,118,.25)}
.tag-l{background:rgba(255,23,68,.15);color:var(--dan);border:1px solid rgba(255,23,68,.25)}
.tag-d{background:rgba(255,171,0,.15);color:var(--warn);border:1px solid rgba(255,171,0,.25)}
.sc{font-weight:600}
.stc{display:flex;flex-direction:column;align-items:center;padding:10px;background:rgba(0,212,255,.03);border:1px solid var(--bd);border-radius:6px}
.stl{font-size:10px;color:var(--td)}.stv{font-size:18px;font-weight:600}
.mc{background:rgba(0,212,255,.03);border:1px solid var(--bd);border-radius:8px;padding:10px 6px;text-align:center;transition:all .3s;cursor:pointer}
.mc:hover{border-color:var(--p);background:rgba(0,212,255,.06);transform:translateY(-2px)}
.mc-img{width:56px;height:36px;object-fit:contain;border-radius:4px;margin-bottom:6px}
.mc-name{font-size:12px;font-weight:600}.mc-count{font-size:10px;color:var(--td);margin-bottom:4px}
.mc-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:3px}
.mc-fill{height:100%;border-radius:2px}.mc-wr{font-size:14px;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pc{display:flex;align-items:center;gap:6px;padding:6px;background:rgba(0,212,255,.02);border:1px solid var(--bd);border-radius:6px}
.pn{font-size:11px;font-weight:600}.pg2{font-size:10px;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#00d4ff,#0066cc);color:#fff;font-weight:700;font-size:11px;flex-shrink:0}
.ir{display:flex;align-items:center;gap:8px;margin-bottom:8px}.in{font-size:11px;color:var(--ts);width:50px}
.ib{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}.if{height:100%;border-radius:3px}
.ic{font-size:11px;font-weight:600;min-width:34px;text-align:right}
.modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
.modal-box{background:var(--bgp);border:1px solid var(--bds);border-radius:12px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:22px;margin:14px}
.modal-close{float:right;width:30px;height:30px;border-radius:6px;background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.2);color:var(--dan);cursor:pointer;font-size:16px}
.mtit{font-size:16px;font-weight:700;color:var(--p);margin-bottom:6px}.msub{font-size:11px;color:var(--ts);margin-bottom:14px}
.msec{font-size:13px;font-weight:600;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.coach{margin-top:14px;padding:10px;background:rgba(0,212,255,.04);border:1px solid var(--bd);border-radius:6px;font-size:11px;color:var(--ts)}
.missing{margin-top:16px;padding:12px;background:rgba(255,171,0,.06);border:1px solid rgba(255,171,0,.2);border-radius:8px;font-size:11px;color:var(--ts)}
.ratio-up{color:var(--suc)}.ratio-down{color:var(--dan)}.ratio-same{color:var(--ts)}
.edit-badge{cursor:pointer;transition:all .2s}.edit-badge:hover{background:rgba(0,212,255,0.18);color:#fff}
.focus-item{padding:10px 12px;background:rgba(0,212,255,.02);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.focus-rank{font-size:18px;color:var(--p);font-weight:700;margin-right:8px}
.focus-label{font-size:13px;font-weight:600}.focus-desc{font-size:11px;color:var(--td);margin-top:2px}
.wk-comp{display:flex;align-items:center;gap:8px;font-size:11px}
.wk-bar-wrap{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin:0 4px}
.wk-bar{height:100%;border-radius:2px}
</style>
</head>
<body>
<div id="dashboard"></div>
<script>
const D=window.DASHBOARD_DATA||{};
const{kpi={},upcomingMatch=null,recentMatches=[],playerStats=[],hsStats=[],teamAverages={},mapStats=[],matchDetails=[],peripherals=[],inventory=[],opponentIntel=null,h2hFromDb={},trainingPlan=[],coachNotes=[],missingData={},weeklyComparison=null}=D;
const n=(v,d=0)=>(v!=null?Number(v).toFixed(d):'—');
const mapImg=n=>{const m={Inferno:'inferno',Mirage:'mirage',Nuke:'nuke',Ancient:'ancient',Anubis:'anubis',Overpass:'overpass',Dust2:'dust2',Train:'train',Vertigo:'vertigo'};return m[n]?'/images/maps/'+m[n]+'.png':null};
let cdownDef=null;

function renderModal(d){
  if(!d){document.getElementById('modal')?.remove();return}
  const isMap=d.map_name&&!d.players;
  const h=isMap?mapModal(d):matchModal(d);
  const div=document.createElement('div');div.id='modal';div.className='modal';
  div.innerHTML=h;
  div.addEventListener('click',e=>{if(e.target===div)renderModal(null)});
  document.body.appendChild(div);
}
function matchModal(d){
  let pl=(d.players||[]).map(p=>{const r=p.rating||0;return`<tr>
    <td style="padding-right:0"><div class="av" style="width:26px;height:26px;font-size:11px">${p.name[0]}</div></td>
    <td><strong>${p.name}</strong><span style="font-size:9px;color:var(--td);margin-left:3px">${p.role||''}</span></td>
    <td style="text-align:right"><div style="display:flex;align-items:center;justify-content:flex-end;gap:4px"><div style="width:40px;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden"><div style="height:100%;border-radius:2px;background:${r>=1.15?'var(--suc)':r>=0.95?'var(--warn)':'var(--dan)'};width:${Math.min(r/1.5*100,100)}%"></div></div><span style="color:${r>=1.1?'var(--suc)':r>=0.9?'var(--warn)':'var(--dan)'}">${n(r,2)}</span></div></td>
    <td style="text-align:right">${p.kd}</td><td style="text-align:right">${n(p.adr,1)}</td><td style="text-align:right">${p.hs||0}%</td></tr>`}).join('');
  const coach=d.notes||(coachNotes||[]).find(c=>c.id===d.id)?.notes;
  return`<div class="modal-box"><button class="modal-close" onclick="renderModal(null)">X</button>
    <div class="mtit">UR vs ${d.opponent}</div><div class="msub">${d.date} · ${d.map} · 比分 ${d.score}</div>
    <div style="display:flex;gap:6px;margin-bottom:12px"><span class="tag" style="background:rgba(0,212,255,.08);color:var(--p)">地图: ${d.map}</span><span class="tag ${d.result==='win'?'tag-w':'tag-l'}">${d.result==='win'?'胜利':'失败'}</span></div>
    <div class="msec">选手数据</div><table class="dt" style="margin-bottom:10px"><thead><tr><th style="width:30px"></th><th>选手</th><th style="text-align:right">Rating</th><th style="text-align:right">K-D</th><th style="text-align:right">ADR</th><th style="text-align:right">HS%</th></tr></thead><tbody>${pl}</tbody></table>
    ${coach?`<div class="coach">📋 ${coach}</div>`:''}</div>`;
}
function mapModal(d){
  let rec=(d.recentMatches||[]).map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:${m.result==='win'?'rgba(0,230,118,.05)':'rgba(255,23,68,.05)'};border-left:2px solid ${m.result==='win'?'var(--suc)':'var(--dan)'};margin-bottom:4px"><span style="font-size:10px;color:var(--td);width:44px">${m.date}</span><span style="flex:1;font-size:11px;font-weight:600">${m.opponent}</span><span style="font-size:11px;font-weight:600;color:${m.result==='win'?'var(--suc)':'var(--dan)'}">${m.score}</span></div>`).join('');
  return`<div class="modal-box" style="max-width:440px"><button class="modal-close" onclick="renderModal(null)">X</button>
    <div class="mtit">${d.map_name}</div><div class="msub">${d.played} 场 · ${d.wins}胜${d.losses}负 · 胜率 ${d.win_rate}%</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px"><div class="stc"><div class="stl">胜场</div><div class="stv" style="color:var(--suc)">${d.wins}</div></div><div class="stc"><div class="stl">负场</div><div class="stv" style="color:var(--dan)">${d.losses}</div></div><div class="stc"><div class="stl">胜率</div><div class="stv" style="color:${d.win_rate>=50?'var(--p)':'var(--dan)'}">${d.win_rate}%</div></div></div>
    ${rec?`<div class="msec">近期战绩</div>${rec}`:''}</div>`;
}

// State
let mapFilter='30';
function setMapFilter(days){
  mapFilter=days;
  document.querySelectorAll('.map-f-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.map-f-btn[data-days="${days}"]`)?.classList.add('active');
  render();
}

function render(){
// Countdown
const cdown=upcomingMatch?(()=>{const t=new Date(upcomingMatch.match_date+'T'+(upcomingMatch.match_time||'00:00:00'));const diff=t-new Date();if(diff<=0)return{d:0,h:0,m:0,s:0};return{d:Math.floor(diff/864e5),h:Math.floor((diff%864e5)/36e5),m:Math.floor((diff%36e5)/6e4),s:Math.floor((diff%6e4)/1e3)}})():null;
cdownDef=cdown;
const days=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):'—';

// Map images by lowercase name
function mi(m){const mp={Inferno:'inferno',Mirage:'mirage',Nuke:'nuke',Ancient:'ancient',Anubis:'anubis',Overpass:'overpass',Dust2:'dust2',Train:'train',Vertigo:'vertigo'};return mp[m]?'/images/maps/'+mp[m]+'.png':null;}

const h=`
<div style="max-width:1600px;margin:0 auto">

  <!-- KPI -->
  <div class="kpi-r">
    <div class="kpi-c"><div class="kpi-i">#</div><div style="flex:1"><div class="kpi-l">VRS Asia 排名</div><div class="kpi-v" style="color:var(--p)">${kpi.vrsRank?'#'+kpi.vrsRank:'—'}</div><div class="kpi-t" style="color:var(--suc)">HLTV 实时</div></div></div>
    <div class="kpi-c"><div class="kpi-i" style="color:var(--suc)">W</div><div style="flex:1"><div class="kpi-l">近十场胜率</div><div class="kpi-v" style="color:${kpi.recentWinRate>=50?'var(--suc)':'var(--dan)'}">${kpi.recentWinRate}%</div><div class="kpi-t" style="color:var(--suc)">${kpi.recentWins}胜/${(kpi.totalRecentMatches||0)-kpi.recentWins}负</div></div></div>
    <div class="kpi-c"><div class="kpi-i" style="color:var(--warn)">Q</div><div style="flex:1"><div class="kpi-l">训练质量</div><div class="kpi-v" style="color:${kpi.trainingQuality>=70?'var(--suc)':kpi.trainingQuality>=50?'var(--warn)':'var(--dan)'}">${kpi.trainingQuality}%</div><div class="kpi-t" style="color:var(--td)"><span style="border-bottom:1px dashed var(--td);cursor:help" title="简报匹配度×0.35+失误率扣分×0.65">计算逻辑</span></div></div></div>
    <div class="kpi-c"><div class="kpi-i" style="color:var(--p)">D</div><div style="flex:1"><div class="kpi-l">分部已成立</div><div class="kpi-v" style="color:var(--p)">${kpi.foundedDate?days(kpi.foundedDate)+'天':'—'}</div><div class="kpi-t" style="color:var(--td)">${kpi.foundedDate||''} 成立</div></div></div>
  </div>

  <!-- Top Row -->
  <div class="top-r">
    <div class="db-panel"><div class="db-pin">
      <div class="db-ph"><div class="db-phi danger"></div><div class="db-pt">即将开始赛事</div><div class="db-pb" style="background:rgba(255,23,68,.1);color:var(--dan);border-color:rgba(255,23,68,.2)">${upcomingMatch?(cdown?cdown.d+'天后':'今日'):'暂无'}</div></div>
      ${upcomingMatch?`
        <div class="mev">${upcomingMatch.event_name||'正赛'}</div><div class="mst">${upcomingMatch.stage||''}${upcomingMatch.bo_format?' · '+upcomingMatch.bo_format:''}</div>
        <div class="mvs"><div style="text-align:center"><div class="mtn" style="color:var(--p)">UR</div><div class="mtr">#${kpi.vrsRank||'—'}</div></div><div class="mvt">VS</div><div style="text-align:center"><div class="mtn">${upcomingMatch.opponent}</div><div class="mtr">${opponentIntel?.vrs_rank?'#'+opponentIntel.vrs_rank+' HLTV':'正式赛'}</div></div></div>
        <div style="text-align:center;font-size:11px;color:var(--ts);margin-bottom:8px">${upcomingMatch.match_date} ${upcomingMatch.match_time||''} (北京时间)</div>
        ${cdown?`<div class="cdb">${[{v:cdown.d,l:'天'},{v:cdown.h,l:'时'},{v:cdown.m,l:'分'},{v:cdown.s,l:'秒'}].map(c=>`<div class="cdi"><div class="cdv">${String(c.v).padStart(2,'0')}</div><div class="cdl">${c.l}</div></div>`).join('')}</div>`:''}
        ${h2hFromDb&&(h2hFromDb.wins+h2hFromDb.losses)>0?`<div class="h2h" style="margin-top:10px"><span>历史交手: </span>${[...Array(h2hFromDb.wins||0)].map(()=>'<span class="h2h-d w"></span>').join('')}${[...Array(h2hFromDb.losses||0)].map(()=>'<span class="h2h-d l"></span>').join('')}<span style="color:var(--ts)">${h2hFromDb.wins||0}W:${h2hFromDb.losses||0}L</span></div>`:''}
      `:`<div style="text-align:center;padding:50px 0;color:var(--td)"><div style="font-size:40px;opacity:.3;margin-bottom:10px">📅</div><div style="font-size:14px">近期暂无正赛</div></div>`}
    </div></div>

    <!-- Middle: Weekly Comparison -->
    <div class="db-panel"><div class="db-pin">
      <div class="db-ph"><div class="db-phi"></div><div class="db-pt">本周训练重点</div><div class="db-pb" style="display:flex;gap:4px"><span class="map-f-btn active" data-days="7" style="font-size:10px;padding:1px 6px;cursor:pointer;border-radius:3px;background:rgba(0,212,255,.1);color:var(--p)" onclick="setMapFilter('7')">7天</span></div></div>
      ${weeklyComparison&&weeklyComparison.topIssues&&weeklyComparison.topIssues.length>0?`
      <div style="margin-bottom:14px">
        <div style="font-size:12px;color:var(--ts);margin-bottom:10px">📊 上周失误TOP3 → 本周重点攻克</div>
        ${weeklyComparison.topIssues.map((issue,i)=>`
          <div class="focus-item">
            <div style="display:flex;align-items:center"><span class="focus-rank">${i+1===1?'🥇':i+1===2?'🥈':'🥉'}</span><span class="focus-label">${issue.issue_type}</span><span style="margin-left:auto;font-size:12px;color:var(--p)">${issue.cnt}次</span></div>
            <div class="wk-bar-wrap" style="margin:6px 0"><div class="wk-bar" style="width:${Math.min(issue.cnt/(weeklyComparison.topIssues[0]?.cnt||1)*100,100)}%;background:linear-gradient(135deg,var(--p),#0066cc)"></div></div>
          </div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div class="stc">
          <div class="stl">本周失误回合</div><div class="stv" style="color:var(--warn)">${weeklyComparison.thisWeekIssueRounds}</div>
          <div style="font-size:9px;margin-top:2px">上周: ${weeklyComparison.lastWeekIssueRounds}</div>
        </div>
        <div class="stc">
          <div class="stl">本周训练回合</div><div class="stv" style="color:var(--p)">${weeklyComparison.thisWeekTotalRounds}</div>
          <div style="font-size:9px;margin-top:2px">上周: ${weeklyComparison.lastWeekTotalRounds}</div>
        </div>
        <div class="stc">
          <div class="stl">本周胜场</div><div class="stv" style="color:var(--suc)">${weeklyComparison.thisWeekWins}</div>
          <div style="font-size:9px;margin-top:2px">负场: ${weeklyComparison.thisWeekLosses}</div>
        </div>
      </div>`:`<div style="text-align:center;padding:40px 0;color:var(--td)"><div style="font-size:40px;opacity:.3;margin-bottom:10px">📊</div><div style="font-size:13px">暂无本周训练数据</div><div style="font-size:10px;margin-top:4px">导入训练日志后自动生成</div></div>`}
    </div></div>

    <!-- Training opponent -->
    <div class="db-panel"><div class="db-pin">
      <div class="db-ph"><div class="db-phi warn"></div><div class="db-pt">近期训练安排</div><div class="db-pb">${upcomingMatch?.bo_format||'待定'}</div></div>
      ${upcomingMatch?`
      <div class="sv">VS</div><div class="sn">${upcomingMatch.opponent}</div>
      ${opponentIntel?.vrs_rank?`<div style="text-align:center;margin-bottom:8px"><span class="tag" style="background:rgba(0,212,255,.08);color:var(--p);font-size:12px;padding:3px 10px">#${opponentIntel.vrs_rank} HLTV</span></div>`:''}
      <div class="sm">${upcomingMatch.event_name||''} ${upcomingMatch.bo_format||''}</div>
      <div class="gl"></div>
      <div class="sig">
        <div class="sii"><div class="sil">近期交手</div><div class="siv">${h2hFromDb?(h2hFromDb.wins||0)+'W/'+(h2hFromDb.losses||0)+'L':'—'}</div></div>
        <div class="sii"><div class="sil">比赛时间</div><div class="siv">${upcomingMatch.match_time||'待定'}</div></div>
        <div class="sii"><div class="sil">地图倾向</div><div class="siv" style="font-size:11px">${opponentIntel?.map_preference||'—'}</div></div>
        <div class="sii"><div class="sil">核心选手</div><div class="siv" style="font-size:11px">${opponentIntel?.core_players||'—'}</div></div>
      </div>
      ${h2hFromDb&&(h2hFromDb.wins+h2hFromDb.losses)>0?`<div class="h2h" style="margin-top:10px"><span>历史战绩:</span>${[...Array(h2hFromDb.wins||0)].map(()=>'<span class="h2h-d w"></span>').join('')}${[...Array(h2hFromDb.losses||0)].map(()=>'<span class="h2h-d l"></span>').join('')}<span style="color:var(--ts)">${h2hFromDb.wins||0}W ${h2hFromDb.losses||0}L</span></div>`:''}
      `:`<div style="text-align:center;padding:50px 0;color:var(--td)"><div style="font-size:40px;opacity:.3;margin-bottom:10px">🎯</div><div style="font-size:13px">近期暂无训练安排</div></div>`}
    </div></div>
  </div>

  <!-- Map Stats (above tables as requested) -->
  <div class="db-panel" style="margin-bottom:16px"><div class="db-pin">
    <div class="db-ph"><div class="db-phi"></div><div class="db-pt">赛训地图统计</div>
    <div class="db-pb" style="display:flex;gap:4px">${[{d:'3天',v:'3'},{d:'7天',v:'7'},{d:'30天',v:'30'}].map(f=>`<span class="map-f-btn ${mapFilter===f.v?'active':''}" data-days="${f.v}" style="font-size:10px;padding:1px 6px;cursor:pointer;border-radius:3px;background:${mapFilter===f.v?'rgba(0,212,255,.1)':'transparent'};color:${mapFilter===f.v?'var(--p)':'var(--td)'}" onclick="setMapFilter('${f.v}')">${f.d}</span>`).join('')}</div></div>
    <div class="g7">${(mapStats||[]).slice(0,7).map(m=>{const wr=m.win_rate||0;const bc=wr>=65?'var(--suc)':wr>=50?'var(--warn)':'var(--dan)';return`<div class="mc" onclick="renderModal(${JSON.stringify(m).replace(/"/g,'&quot;')})">${mi(m.map_name)?`<img class="mc-img" src="${mi(m.map_name)}" alt="${m.map_name}" onerror="this.style.display='none'">`:''}<div class="mc-name">${m.map_name}</div><div class="mc-count">${m.played}场·${m.wins}W/${m.losses}L</div><div class="mc-bar"><div class="mc-fill" style="width:${wr}%;background:${bc}"></div></div><div class="mc-wr" style="color:${bc}">${wr}%</div></div>`}).join('')}</div>
  </div></div>

  <!-- Matches + Players -->
  <div class="g2">
    <div class="db-panel"><div class="db-pin" style="display:flex;flex-direction:column">
      <div class="db-ph"><div class="db-phi"></div><div class="db-pt">近五场赛事记录</div><div class="db-pb">点击查看详情</div></div>
      <div style="flex:1"><table class="dt"><thead><tr><th>日期</th><th>对手</th><th>地图</th><th style="text-align:right">比分</th><th style="text-align:center">结果</th></tr></thead>
      <tbody>${(recentMatches||[]).slice(0,5).map(m=>`<tr style="cursor:pointer" onclick="renderModal(${JSON.stringify((matchDetails||[]).find(d=>d.id===m.id)||{}).replace(/"/g,'&quot;')})"><td>${m.date?.slice(5)}</td><td><strong>${m.opponent}</strong></td><td>${m.map}</td><td class="sc" style="text-align:right">${m.score}</td><td style="text-align:center"><span class="tag ${m.result==='win'?'tag-w':m.result==='loss'?'tag-l':'tag-d'}">${m.result==='win'?'W':m.result==='loss'?'L':'D'}</span></td></tr>`).join('')}</tbody></table></div>
      <div class="gl"></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--td);margin-top:auto"><span>近10场: W${kpi.recentWins}/L${(kpi.totalRecentMatches||0)-kpi.recentWins}</span><span>胜率: <strong style="color:var(--suc)">${kpi.recentWinRate}%</strong></span></div>
    </div></div>

    <div class="db-panel"><div class="db-pin" style="display:flex;flex-direction:column">
      <div class="db-ph"><div class="db-phi"></div><div class="db-pt">近五场选手数据</div><div class="db-pb">Rating / K-D / ADR / HS%</div></div>
      <div style="flex:1"><table class="dt"><thead><tr><th style="width:32px"></th><th>选手</th><th style="text-align:right">Rating</th><th style="text-align:right">K-D</th><th style="text-align:right">ADR</th><th style="text-align:right">HS%</th></tr></thead>
      <tbody>${playerStats.map(p=>{const hs=(hsStats||[]).find(h=>h.nickname===p.nickname);const r=p.avg_rating||0;const rc=r>=1.1?'var(--suc)':r>=0.95?'var(--warn)':'var(--dan)';return`<tr style="cursor:pointer"><td style="padding-right:0"><div class="av">${p.nickname[0]}</div></td><td><strong>${p.nickname}</strong><span style="font-size:9px;color:var(--td);margin-left:3px">${p.in_game_role||''}</span></td><td class="sc" style="text-align:right;color:${rc}">${n(r,2)}</td><td style="text-align:right">${p.total_kills}-${p.total_deaths}</td><td style="text-align:right">${n(p.avg_adr,1)}</td><td style="text-align:right">${hs?hs.hs_pct+'%':'—'}</td></tr>`}).join('')}</tbody></table></div>
      <div class="gl"></div>
      <div style="display:flex;gap:12px;margin-top:auto"><div class="stc" style="flex:1"><div class="stl">团队 Rating</div><div class="stv" style="color:var(--suc)">${n(teamAverages.rating,2)}</div></div><div class="stc" style="flex:1"><div class="stl">团队 ADR</div><div class="stv" style="color:var(--p)">${n(teamAverages.adr,1)}</div></div></div>
    </div></div>
  </div>

  <!-- Peripherals + Inventory -->
  <div class="g2">
    <div class="db-panel"><div class="db-pin">
      <div class="db-ph"><div class="db-phi"></div><div class="db-pt">选手外设使用汇总</div><span class="db-pb edit-badge" onclick="alert('编辑功能即将开放')" style="font-size:10px">✏ 编辑</span></div>
      ${(peripherals||[]).length>0?`<div class="pg">${peripherals.map(p=>`<div class="pc"><div class="av">${p.nickname?.[0]||'?'}</div><div><div class="pn">${p.nickname}<span style="font-size:9px;color:var(--td)"> ${p.in_game_role||''}</span></div><div class="pg2">${[p.keyboard,p.mouse,p.headset].filter(Boolean).join(' · ')||'未设置'}</div></div></div>`).join('')}</div>`:`<div style="text-align:center;padding:24px;color:var(--td);font-size:12px">外设数据未录入</div>`}
    </div></div>

    <div class="db-panel"><div class="db-pin">
      <div class="db-ph"><div class="db-phi"></div><div class="db-pt">库存备用外设汇总</div><span class="db-pb edit-badge" onclick="alert('编辑功能即将开放')" style="font-size:10px">✏ 编辑</span></div>
      ${(inventory||[]).length>0?`<div>${inventory.map(item=>{const pct=item.max_count>0?(item.current_count/item.max_count*100):0;const bc=pct>=50?'var(--suc)':pct>=20?'var(--warn)':'var(--dan)';return`<div class="ir"><span class="in">${item.item_type}</span><div class="ib"><div class="if" style="width:${pct}%;background:${bc}"></div></div><span class="ic" style="color:${bc}">${item.current_count}/${item.max_count}</span></div>`}).join('')}${inventory.some(i=>i.max_count>0&&i.current_count/i.max_count<0.25)?'<div style="text-align:center;font-size:10px;color:var(--dan);margin-top:6px">⚠️ 部分库存不足</div>':''}</div>`:`<div style="text-align:center;padding:24px;color:var(--td);font-size:12px">库存数据未录入</div>`}
    </div></div>
  </div>

  <!-- Coach Notes -->
  ${(coachNotes||[]).length>0?`<div class="db-panel" style="margin-top:16px"><div class="db-pin"><div class="db-ph"><div class="db-phi"></div><div class="db-pt">教练评语</div></div>${coachNotes.map(n=>`<div style="padding:8px 10px;background:rgba(0,212,255,.02);border:1px solid var(--bd);border-radius:6px;font-size:11px;margin-bottom:6px"><div style="color:var(--td);margin-bottom:3px">${n.date} · ${n.opponent} · ${n.map}</div><div style="color:var(--ts);line-height:1.5">${n.notes}</div></div>`).join('')}</div></div>`:''}

  <!-- Missing -->
  ${Object.values(missingData||{}).filter(Boolean).length>0?`<div class="missing"><strong>⚠ 部分数据暂不可用</strong><ul style="margin-top:4px;padding-left:16px">${Object.entries(missingData||{}).filter(([,v])=>v).map(([,msg])=>`<li>${msg}</li>`).join('')}</ul></div>`:''}
</div>`;
document.getElementById('dashboard').innerHTML=h;
if(cdown){setInterval(()=>{const t=new Date(upcomingMatch.match_date+'T'+(upcomingMatch.match_time||'00:00:00'));const diff=t-new Date();if(diff<=0)return;cdown.d=Math.floor(diff/864e5);cdown.h=Math.floor((diff%864e5)/36e5);cdown.m=Math.floor((diff%36e5)/6e4);cdown.s=Math.floor((diff%6e4)/1e3);document.querySelectorAll('.cdv').forEach((el,i)=>{const vs=[cdown.d,cdown.h,cdown.m,cdown.s];if(vs[i]!==undefined)el.textContent=String(vs[i]).padStart(2,'0')})},1e3)}
}render();
</script></body></html>
